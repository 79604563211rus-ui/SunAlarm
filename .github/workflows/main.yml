name: Build SunAlarm APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Generate project files
        run: |
          bash gen1.sh
          bash gen2.sh
          bash gen3.sh
          bash gen4.sh
          bash gen5.sh
          bash gen6.sh

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SunAlarm.apk
          unzip -t SunAlarm.apk
          ls -lh SunAlarm.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SunAlarm
          path: SunAlarm.apk
